<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
  /* Layout: single centered game column, canvas only (วิธีเล่นอยู่ในหน้าต่าง Tutorial กด T). One committed dark "hangar" look. */
  :root {
    --bg: #161a1e;
    --panel: #20262c;
    --line: #333c45;
    --fg: #d9dfd2;
    --muted: #8d978c;
    --olive: #6d7a47;
    --amber: #e0a526;
    --font-display: 'Chakra Petch', 'Noto Sans Thai', system-ui, sans-serif;
    --font-body: 'Chakra Petch', 'Noto Sans Thai', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 24px 40px;
  }
  .wrap { max-width: 800px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; flex-direction: column; gap: 2px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    color: var(--amber);
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); }
  #game {
    display: block;
    width: 100%;
    max-width: 800px;
    height: auto;
    aspect-ratio: 800 / 450;
    background: #0f1316;
    border: 1px solid var(--line);
    cursor: none;
    outline: none;
    touch-action: none;
  }
  #game:focus-visible { border-color: var(--amber); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Wanzer Prototype</h1>
    <p>ต้นแบบเกม Side-Scrolling Mecha Action สไตล์ Gun Hazard</p>
  </header>

  <canvas id="game" width="800" height="450" tabindex="0" aria-label="หน้าจอเกม Wanzer Prototype"></canvas>

</main>
